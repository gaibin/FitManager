<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>NeonFit Studio Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
            colors: {
              apple: {
                bg: '#f5f5f7',
                card: '#ffffff',
                blue: '#007AFF',
                indigo: '#5856D6',
                green: '#34C759',
                orange: '#FF9500',
                red: '#FF3B30',
                pink: '#FF2D55',
                teal: '#5AC8FA',
                gray: '#8E8E93',
                text: '#1D1D1F',
                secondary: '#86868B',
                border: '#E5E5EA',
                fill: '#F2F2F7',
              }
            }
          }
        }
      }
    </script>
    <style>
      * { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      body { background-color: #f5f5f7; color: #1D1D1F; margin: 0; }
      .glass {
        background: rgba(250, 250, 252, 0.72);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
      }
      .card-hover {
        transition: all 0.2s cubic-bezier(0.25, 0.1, 0.25, 1);
      }
      .card-hover:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
      }
      .scale-press { transition: transform 0.15s ease; }
      .scale-press:active { transform: scale(0.97); }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.10); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.18); }
      @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .animate-in { animation: fadeSlideIn 0.3s ease-out; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
